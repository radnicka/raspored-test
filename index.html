.controls{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center}

,Abec.,Ostalo,Pult,Noš.,Arhiv,Abec.,Ostalo\n08:00,ISM,ZB,,,,MO,KM,,,,KM,MK,,,,KM,MK,,,,KM,MK,,,\n08:30,ISM,ZB,,,,MO,KM,,,,KM,MK,,,,KM,MK,,,,KM,MK,,,\n09:00,ISM,ZB,,,,MO,KM,,,,KM,MK,,,,KM,MK,,,,KM,MK,,,\n09:30,ISM,ZB,,,,MO,KM,,,,KM,MK,,,,KM,MK,,,,KM,MK,,,\n10:00,ISM,ZB,,,,MO,KM,,,,KM,MK,,,,KM,MK,,,,KM,MK,,,\n10:30,ISM,ZB,,,,MO,KM,,,,KM,MK,,,,KM,MK,,,,KM,MK,,,\n11:00,ZB,ISM,,,,KM,MO,,,,MK,KM,,,,MK,KM,,,,MK,KM,,,\n11:30,ZB,ISM,,,,KM,MO,,,,MK,KM,,,,MK,KM,,,,MK,KM,,,\n12:00,ZB,ISM,,,,KM,MO,,,,MK,KM,,,,MK,KM,,,,MK,KM,,,\n12:30,ZB,ISM,,,,KM,MO,,,,MK,KM,,,,MK,KM,,,,MK,KM,,,\n13:00,ZB,MO,KM-u,,ISM-D,KM,MO,MP-u,,ISM-D,MK,KM,,,ISM-D,MK,KM,,,ISM-D,MK,KM,,,\n13:30,ZB,MO,KM-u,,ISM-D,KM,MO,MP-u,,ISM-D,MK,KM,,,ISM-D,MK,KM,,,ISM-D,MK,KM,,,\n14:00,KM,MO,,,ISM-D,MP,MO,KM-u,,ISM-D,KM,MP,MK-U,,ISM-D,KM,MP,MK-U,,ISM-D,ISM,MP,,,\n14:30,KM,MO,,,ISM-D,MP,MO,KM-u,,ISM-D,KM,MP,MK-U,,ISM-D,KM,MP,MK-U,,ISM-D,ISM,MP,,,\n15:00,KM,MO,,,,MP,ISM,,,,ISM,MP,,,,ISM,MP,,,,ISM,MP,,,\n15:30,KM,MO,,,,MP,ISM,,,,ISM,MP,,,,ISM,MP,,,,ISM,MP,,,\n16:00,KM,MO,,,,MP,ISM,,,,ISM,MP,,,,ISM,MP,,,,ISM,MP,,,\n16:30,KM,MO,,,,MP,ISM,,,,ISM,MP,,,,ISM,MP,,,,ISM,MP,,,\n17:00,MO,KM,,,,ISM,MP,,,,ISM,MP,,,,ISM,MP,,,,ISM,MP,,,\n17:30,MO,KM,,,,ISM,MP,,,,MP,ISM,,,,MP,ISM,,,,MP,ISM,,,\n18:00,MO,KM,,,,ISM,MP,,,,MP,ISM,,,,MP,ISM,,,,MP,ISM,,,\n18:30,MO,KM,,,,ISM,MP,,,,MP,ISM,,,,MP,ISM,,,,MP,ISM,,,\n19:00,MO,KM,,,,ISM,MP,,,,MP,ISM,,,,MP,ISM,,,,MP,ISM,,,\n19:30,MO,KM,,,,ISM,MP,,,,MP,ISM,,,,MP,ISM,,,,MP,ISM,,,\n,,,,,,,,,,,,,,,,,,,,,,,,,\nNapomena,\"Dostava pon, sri\",,,,,,,,,,,,,,,,,,,,,,,,\n", "osobe": "Kratica,Ime i prezime,Također piše kao,Boja\nSK,Sonja Kuzmić,,#F1C232\nKM,Ksenija Marton,,#6AA84F\nMP,Maja Perković,,#E06666\nISM,Ivan Salopek Mirosavljević,,#C27BA0\nIV,Ivana Vidović,,#4A86E8\nMK,Marijana Kolak,,#F6821F\nMO,Marijana Oroz,,#45B8C8\nILP,Ivana Ledić Preprotnik,,#B7B7B7\nZB,Zorica Bičanić,,#FF33CC\n"};

const DAY_NAMES=["Ponedjeljak","Utorak","Srijeda","Četvrtak","Petak","Subota"];
const DAY_SHORT=["Pon","Uto","Sri","Čet","Pet","Sub"];
const MONTHS_GEN=["siječnja","veljače","ožujka","travnja","svibnja","lipnja","srpnja","kolovoza","rujna","listopada","studenoga","prosinca"];

const $app=document.getElementById("app");
const state={view:"dan",day:0,tab:"smjene",person:""};
let D=null;

/* ---------- helpers ---------- */
function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(cell);cell="";}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell);rows.push(row);row=[];cell=""; }
    else cell+=c;
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  return rows.map(r=>r.map(v=>v.trim()));
}
const low=s=>(s||"").trim().toLowerCase();
const norm=s=>low(s).replace(/\s+/g," ");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isTime=t=>/\d/.test(t||"");
function toMin(s){const m=(s||"").match(/(\d{1,2})[:.](\d{2})/);return m?(+m[1])*60+(+m[2]):null;}
const hm=n=>`${String(Math.floor(n/60)).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`;
function parseDate(s){
  if(!s) return null; let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1],m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return new Date(+m[3],m[1]-1,+m[2]);
  if((m=s.match(/(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/))) return new Date(+m[3],m[2]-1,+m[1]);
  return null;
}
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dm=d=>`${d.getDate()}. ${d.getMonth()+1}.`;
const dayIndex=name=>{const n=norm(name); if(!n) return -1; return DAY_NAMES.findIndex(d=>n===norm(d)||n.startsWith(norm(d).slice(0,3)));};
const stepOf=slots=>slots.length>1?slots[1].t-slots[0].t:60;
function firstMinute(s){const m=(s||"").match(/(\d{1,2})(?:[:.](\d{2}))?/);return m?(+m[1])*60+(+(m[2]||0)):null;}

/* ---------- parsers ---------- */
function parseSmjene(rows){
  const week=rows.find(r=>low(r[0]).startsWith("tjedan"));
  const h=rows.findIndex(r=>low(r[0])==="odjeljak");
  if(h<0) throw new Error("List Smjene: nije pronađen redak sa zaglavljem „Odjeljak”.");
  const sections=[],saturday=[];
  rows.slice(h+1).forEach(r=>{
    const sec=r[0]||"",term=r[1]||"",cells=[2,3,4,5,6].map(i=>r[i]||"");
    if(r[7]) saturday.push(r[7]);
    if(!sec) return;
    let s=sections[sections.length-1];
    if(!s||s.name!==sec){s={name:sec,rows:[]};sections.push(s);}
    s.rows.push({term,cells});
  });
  return {start:week?parseDate(week[1]):null,sections,saturday};
}
function parseRevizija(rows){
  const h=rows.findIndex(r=>low(r[0])==="vrijeme");
  if(h<0) throw new Error("List Revizija: nije pronađen redak sa zaglavljem „Vrijeme”.");
  const cols=rows[h].map((v,i)=>({i,day:dayIndex(v)})).filter(c=>c.i>0&&c.day>=0&&c.day<5);
  const slots=[];
  rows.slice(h+1).forEach(r=>{const t=toMin(r[0]); if(t==null) return;
    const cells=["","","","",""]; cols.forEach(c=>cells[c.day]=r[c.i]||""); slots.push({t,cells});});
  return {slots,step:stepOf(slots)};
}
function parseTeh(rows){
  const h=rows.findIndex(r=>low(r[0])==="vrijeme");
  if(h<1) throw new Error("List Tehničari: iznad retka „Vrijeme” mora biti redak s danima.");
  let cur=-1;const cols=[],tasks=[];
  rows[h].forEach((task,i)=>{
    if(i===0) return;
    const dn=(rows[h-1]||[])[i]; if(dn) cur=dayIndex(dn);
    if(cur<0||cur>4||!task) return;
    if(!tasks.includes(task)) tasks.push(task);
    cols.push({i,day:cur,task:tasks.indexOf(task)});
  });
  const notes=[];
  rows.forEach(r=>{if(low(r[0]).startsWith("napomena")){const n=r.slice(1).filter(Boolean).join(" ");if(n) notes.push(n);}});
  const slots=[];
  rows.slice(h+1).forEach(r=>{const t=toMin(r[0]); if(t==null) return;
    const cells=[0,1,2,3,4].map(()=>tasks.map(()=>"")); cols.forEach(c=>cells[c.day][c.task]=r[c.i]||""); slots.push({t,cells});});
  const step=stepOf(slots);
  const runs=[0,1,2,3,4].map(d=>tasks.map((_,k)=>{
    const out=[];
    slots.forEach((s,si)=>{const v=s.cells[d][k]; if(!v) return; const last=out[out.length-1];
      if(last&&norm(last.val)===norm(v)&&last.endIdx===si-1){last.endIdx=si;last.to=s.t+step;}
      else out.push({val:v,startIdx:si,endIdx:si,from:s.t,to:s.t+step});});
    return out;}));
  return {tasks,slots,step,runs,notes};
}
function parseOsobe(rows){
  const h=rows.findIndex(r=>low(r[0])==="kratica");
  if(h<0) return [];
  return rows.slice(h+1).filter(r=>r[0]||r[1]).map(r=>({
    code:(r[0]||"").toUpperCase(), name:r[1]||"",
    aliases:(r[2]||"").split(";").map(s=>s.trim()).filter(Boolean),
    color:/^#?[0-9a-f]{6}$/i.test(r[3]||"")?"#"+r[3].replace("#",""):""
  }));
}

/* ---------- people & matching ---------- */
function nameTokens(v){
  if(!v) return [];
  let s=v; const sw=s.split(/\s*(?:>|→)\s*/); if(sw.length===2&&sw[0]&&sw[1]) s=sw[1];
  return s.split(/\s*[+,;]\s*/).map(x=>x
    .replace(/\(.*?\)/g,"").replace(/tehn\.?/gi,"")
    .replace(/\d{1,2}(?:[:.]\d{2})?\s*[–-]\s*\d{1,2}(?:[:.]\d{2})?/g,"")
    .replace(/\s+-\s+.*$/,"").replace(/\s+/g," ").trim()).filter(x=>x.length>1);
}
function codeParts(v){
  return (v||"").split(/\s*\+\s*/).filter(Boolean).map(p=>{
    const m=p.match(/^([^\s-]+)\s*(?:-\s*(.+))?$/);
    return m?{code:m[1].toUpperCase(),suffix:(m[2]||"").trim()}:{code:p.toUpperCase(),suffix:""};
  });
}
const matchName=(v,p)=>nameTokens(v).some(t=>p.names.has(norm(t)));
const matchCode=(v,p)=>codeParts(v).some(c=>p.codes.has(c.code));
const person=()=>state.person&&D?D.people.find(p=>p.key===state.person):null;

function buildPeople(){
  const map=new Map();
  D.osobe.forEach(o=>{
    const key="o:"+(o.code||norm(o.name));
    map.set(key,{key,label:o.name?(o.code?`${o.name} (${o.code})`:o.name):o.code,
      names:new Set([o.name,...o.aliases].filter(Boolean).map(norm)),codes:new Set(o.code?[o.code]:[])});
  });
  const people=()=>[...map.values()];
  const addName=raw=>nameTokens(raw).forEach(t=>{const n=norm(t);
    if(!people().some(p=>p.names.has(n))) map.set("n:"+n,{key:"n:"+n,label:t,names:new Set([n]),codes:new Set()});});
  const addCode=raw=>codeParts(raw).forEach(c=>{
    if(!people().some(p=>p.codes.has(c.code))) map.set("c:"+c.code,{key:"c:"+c.code,label:c.code,names:new Set(),codes:new Set([c.code])});});
  if(D.smjene){D.smjene.sections.forEach(s=>s.rows.forEach(r=>r.cells.forEach(addName))); D.smjene.saturday.forEach(addName);}
  if(D.revizija) D.revizija.slots.forEach(s=>s.cells.forEach(addName));
  if(D.teh) D.teh.slots.forEach(s=>s.cells.forEach(day=>day.forEach(addCode)));
  return people().sort((a,b)=>a.label.localeCompare(b.label,"hr"));
}
function colorFor(code){
  const o=D.osobe.find(x=>x.code===code);
  if(o&&o.color) return o.color;
  let h=0;for(const ch of code) h=(h*31+ch.charCodeAt(0))>>>0;
  return PALETTE[h%PALETTE.length];
}
function textOn(hex){
  const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return (0.299*r+0.587*g+0.114*b)/255>0.55?"#1c2a3a":"#ffffff";
}
const fullName=code=>{const o=D.osobe.find(x=>x.code===code);return o&&o.name?o.name:code;};

/* ---------- formatting ---------- */
const nameHTML=v=>esc(v).replace(/(\d{1,2}(?:[:.]\d{2})?\s*[–-]\s*\d{1,2}(?:[:.]\d{2})?)/,'<span class="hrs">$1</span>');
function fmt(v){
  if(!v) return "—";
  const p=v.split(/\s*(?:>|→)\s*/);
  if(p.length===2&&p[0]&&p[1]) return `<span class="swap"><s>${esc(p[0])}</s>${nameHTML(p[1])}</span>`;
  return nameHTML(v);
}
function nameCls(vals){
  vals=[].concat(vals).filter(Boolean); if(!vals.length) return "empty";
  const p=person(); return "busy"+(p&&vals.some(v=>matchName(v,p))?" hit":"");
}
function codeCls(v){const p=person();return "blk busy"+(p&&matchCode(v,p)?" hit":"");}
function codesHTML(v){
  return codeParts(v).map(c=>`${esc(c.code)}${c.suffix?`<small>${esc(c.suffix)}</small>`:""}`).join(" + ");
}
function blockStyle(v){const c=colorFor(codeParts(v)[0].code);return `background:${c};color:${textOn(c)}`;}
const shift=name=>/jutr/i.test(name)?"am":"pm";
const card=(cls,title,sub,body)=>`<section class="card ${cls}"><div class="panel-head"><h2>${title}</h2>${sub?`<p>${sub}</p>`:""}</div>${body}</section>`;

function nowInfo(){
  const t=new Date(),today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  return {idx:D.dates?D.dates.findIndex(d=>d.getTime()===today.getTime()):-1,min:t.getHours()*60+t.getMinutes()};
}
const dayLabel=i=>`${DAY_NAMES[i]}${D.dates?`, ${dm(D.dates[i])}`:""}`;
function codeLegend(codes){
  const list=[...codes]; if(!list.length) return "";
  return `<ul class="codes">${list.map(c=>{const col=colorFor(c);return `<li><b style="background:${col};color:${textOn(col)}">${esc(c)}</b>${esc(fullName(c)===c?"":fullName(c))}</li>`;}).join("")}</ul>`;
}

/* ---------- day view ---------- */
function smjeneDay(i){
  const S=D.smjene; if(!S) return "";
  if(i===5) return card("p-smj","Smjene","Subota",
    S.saturday.length?`<ul class="plain">${S.saturday.map(n=>`<li class="${nameCls(n)}">${esc(n)}</li>`).join("")}</ul>`:`<p class="status">Nema upisanih djelatnika.</p>`);
  let body="";
  S.sections.forEach(sec=>{
    const groups=[];
    sec.rows.forEach(r=>{let g=groups.find(x=>x.term===r.term); if(!g){g={term:r.term,vals:[]};groups.push(g);} if(r.cells[i]) g.vals.push(r.cells[i]);});
    const rows=groups.filter(g=>isTime(g.term)||g.vals.length).map(g=>
      `<div class="row"><dt>${esc(g.term||"U smjeni")}</dt><dd class="${nameCls(g.vals)}">${g.vals.length?g.vals.map(fmt).join(", "):"—"}</dd></div>`).join("");
    if(rows) body+=`<h3 class="sub ${shift(sec.name)}">${esc(sec.name)}</h3><dl>${rows}</dl>`;
  });
  return card("p-smj","Smjene","",body||`<p class="status">Nema upisanih smjena.</p>`);
}
function revizijaDay(i,now){
  const R=D.revizija; if(!R||i>4) return "";
  const rows=R.slots.map(s=>{
    const isNow=now.idx===i&&now.min>=s.t&&now.min<s.t+R.step, v=s.cells[i];
    return `<div class="row${isNow?" now":""}"><dt>${hm(s.t)}${isNow?'<span class="badge">sada</span>':""}</dt><dd class="${nameCls(v)}">${fmt(v)}</dd></div>`;
  }).join("");
  return card("p-rev","Revizija","",rows?`<dl>${rows}</dl>`:`<p class="status">Nema termina.</p>`);
}
function tehTable(days,now,wide){
  const T=D.teh;
  const vis=T.tasks.map((_,k)=>k).filter(k=>days.some(d=>T.runs[d][k].length));
  if(!vis.length) return `<p class="status">Nema upisanih poslova.</p>`;
  const used=new Set();
  let h=`<div class="scroll"><table class="teh${wide?" tehwk":""}"><thead>`;
  if(wide) h+=`<tr><th class="time" rowspan="2">Vrijeme</th>${days.map(d=>`<th colspan="${vis.length}" class="daystart${d===now.idx?" is-today":""}">${DAY_NAMES[d]}${d===now.idx?'<span class="badge">danas</span>':""}${D.dates?`<span class="date">${dm(D.dates[d])}</span>`:""}</th>`).join("")}</tr><tr>`;
  else h+=`<tr><th class="time">Vrijeme</th>`;
  days.forEach(d=>vis.forEach((k,j)=>h+=`<th class="${wide&&j===0?"daystart":""}">${esc(T.tasks[k])}</th>`));
  h+=`</tr></thead><tbody>`;
  T.slots.forEach((s,si)=>{
    const nowRow=days.includes(now.idx)&&now.min>=s.t&&now.min<s.t+T.step;
    h+=`<tr${nowRow?' class="now"':""}><th class="time">${hm(s.t)}</th>`;
    days.forEach(d=>vis.forEach((k,j)=>{
      const ds=wide&&j===0?" daystart":"";
      const run=T.runs[d][k].find(r=>si>=r.startIdx&&si<=r.endIdx);
      if(!run){h+=`<td class="empty${ds}"></td>`;return;}
      if(run.startIdx!==si) return;
      codeParts(run.val).forEach(c=>used.add(c.code));
      const span=run.endIdx-run.startIdx+1, range=`${hm(run.from)}–${hm(run.to)}`;
      h+=`<td rowspan="${span}" class="${codeCls(run.val)}${ds}" style="${blockStyle(run.val)}" title="${esc(codeParts(run.val).map(c=>fullName(c.code)).join(" + "))}, ${range}">${codesHTML(run.val)}${!wide&&span>1?`<span class="range">${range}</span>`:""}</td>`;
    }));
    h+=`</tr>`;
  });
  h+=`</tbody></table></div>`;
  return h+codeLegend(used)+(T.notes.length?`<p class="note">${T.notes.map(esc).join("<br>")}</p>`:"");
}
function tehDay(i,now){
  if(!D.teh||i>4) return "";
  return card("p-teh","Tehničari","Dodatni poslovi",tehTable([i],now,false));
}
function dayView(now){
  const i=state.day;
  const parts=[smjeneDay(i),revizijaDay(i,now),tehDay(i,now)].filter(Boolean);
  return `<div class="daygrid${parts.length===1?" single":""}">${parts.join("")}</div>`;
}

/* ---------- week view ---------- */
function smjeneWeek(now){
  const S=D.smjene;
  const cls=(i,v)=>[i===now.idx?"is-today":"",nameCls(v)].filter(Boolean).join(" ");
  let t=`<div class="scroll"><table class="wk"><thead><tr><th class="time">Vrijeme</th>${[0,1,2,3,4].map(i=>`<th class="${i===now.idx?"is-today":""}">${DAY_NAMES[i]}${i===now.idx?'<span class="badge">danas</span>':""}${D.dates?`<span class="date">${dm(D.dates[i])}</span>`:""}</th>`).join("")}</tr></thead><tbody>`;
  S.sections.forEach(sec=>{
    const vis=sec.rows.filter(r=>isTime(r.term)||r.cells.some(Boolean)); if(!vis.length) return;
    t+=`<tr class="section"><th colspan="6">${esc(sec.name)}</th></tr>`;
    let prev=null;
    vis.forEach(r=>{const label=r.term===prev?"":r.term;prev=r.term;
      t+=`<tr class="${shift(sec.name)}"><th class="time">${esc(label)}</th>${r.cells.map((c,i)=>`<td class="${cls(i,c)}">${fmt(c)}</td>`).join("")}</tr>`;});
  });
  t+=`</tbody></table></div>`;
  const sat=S.saturday.length?card("",`Subota${D.dates?`, ${dm(D.dates[5])}`:""}`,"",`<ul class="plain">${S.saturday.map(n=>`<li class="${nameCls(n)}">${esc(n)}</li>`).join("")}</ul>`):"";
  return `<div class="week-layout">${card("","Smjene","",t)}${sat}</div>`;
}
function revizijaWeek(now){
  const R=D.revizija;
  let t=`<div class="scroll"><table class="wk"><thead><tr><th class="time">Vrijeme</th>${[0,1,2,3,4].map(i=>`<th class="${i===now.idx?"is-today":""}">${DAY_NAMES[i]}${i===now.idx?'<span class="badge">danas</span>':""}${D.dates?`<span class="date">${dm(D.dates[i])}</span>`:""}</th>`).join("")}</tr></thead><tbody>`;
  R.slots.forEach(s=>{
    t+=`<tr><th class="time">${hm(s.t)}</th>${s.cells.map((c,i)=>{
      const isNow=i===now.idx&&now.min>=s.t&&now.min<s.t+R.step;
      return `<td class="${[i===now.idx?"is-today":"",nameCls(c)].join(" ")}"${isNow?' style="background:var(--am)"':""}>${c?fmt(c):""}</td>`;}).join("")}</tr>`;
  });
  return card("","Revizija","",t+`</tbody></table></div>`);
}
function weekView(now){
  if(state.tab==="revizija") return revizijaWeek(now);
  if(state.tab==="tehnicari") return card("","Tehničari","Dodatni poslovi",tehTable([0,1,2,3,4],now,true));
  return smjeneWeek(now);
}

/* ---------- person summary ---------- */
function summary(now){
  const p=person(); if(!p) return "";
  const days=[0,1,2,3,4,5].map(()=>[]);
  const S=D.smjene,R=D.revizija,T=D.teh;
  if(S){
    S.sections.forEach(sec=>sec.rows.forEach(r=>r.cells.forEach((v,i)=>{
      if(!matchName(v,p)) return;
      const own=(v.match(/\d{1,2}(?:[:.]\d{2})?\s*[–-]\s*\d{1,2}(?:[:.]\d{2})?/)||[])[0];
      const when=own||(isTime(r.term)?r.term:"");
      days[i].push({src:"Smjene",what:isTime(r.term)?sec.name:(r.term?`${sec.name}, ${r.term}`:sec.name),when,
        key:firstMinute(when)??(/jutr/i.test(sec.name)?480.5:/dežur/i.test(r.term)?1190:840.5)});
    })));
    S.saturday.forEach(v=>{if(matchName(v,p)) days[5].push({src:"Smjene",what:"Subota",when:"",key:0});});
  }
  if(R){
    [0,1,2,3,4].forEach(i=>{let run=null;
      R.slots.forEach(s=>{const hit=matchName(s.cells[i],p);
        if(hit&&run&&run.to===s.t) run.to=s.t+R.step;
        else if(hit){run={from:s.t,to:s.t+R.step};days[i].push({src:"Revizija",what:"",run});}
        else run=null;});
    });
    days.forEach(d=>d.forEach(e=>{if(e.run){e.when=`${hm(e.run.from)}–${hm(e.run.to)}`;e.key=e.run.from;}}));
  }
  if(T){
    [0,1,2,3,4].forEach(i=>T.tasks.forEach((task,k)=>T.runs[i][k].forEach(r=>{
      if(!matchCode(r.val,p)) return;
      const suf=codeParts(r.val).filter(c=>p.codes.has(c.code)).map(c=>c.suffix).filter(Boolean).join(", ");
      days[i].push({src:"Tehničari",what:task+(suf?` (${suf})`:""),when:`${hm(r.from)}–${hm(r.to)}`,key:r.from});
    })));
  }
  const any=days.some(d=>d.length);
  const body=any?`<div class="sum-days">${days.map((list,i)=>list.length?`<div class="sum-day"><h3><button data-act="day" data-v="${i}" data-go="1" data-key="sum-${i}">${dayLabel(i)}</button>${i===now.idx?'<span class="badge">danas</span>':""}</h3><ul>${
      list.sort((a,b)=>a.key-b.key).map(e=>`<li><span class="when">${esc(e.when||"")}</span><span><span class="src">${e.src}</span>${esc(e.what)}</span></li>`).join("")}</ul></div>`:"").join("")}</div>`
    :`<p class="status">U ovom tjednu nema upisanih zaduženja.</p>`;
  return `<section class="card summary"><div class="panel-head"><h2>${esc(p.label)}</h2><button data-act="clear" data-key="clear">Prikaži sve</button></div>${body}</section>`;
}

function render(){

function save(){try{localStorage.setItem("raspored-osoba",state.person);}catch(e){}}

$app.addEventListener("click",e=>{

/* ---------- loading ---------- */
async function getCSV(key){
  const url=CONFIG[key]; if(!url) return null;
  const res=await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
  if(!res.ok) throw new Error(`${LABEL[key]}: poslužitelj je vratio grešku ${res.status}.`);
  const text=await res.text();
  if(/<html/i.test(text.slice(0,500))) throw new Error(`${LABEL[key]}: adresa ne vodi na CSV, nego na web stranicu.`);
  return text;
}
let firstLoad=true;
async function load(){
  const demo=!Object.values(CONFIG).some(Boolean);
  const keys=["smjene","revizija","tehnicari","osobe"];
  const results=await Promise.allSettled(keys.map(k=>demo?Promise.resolve(DEMO[k]):getCSV(k)));
  const errors=[],d={};
  const parse=(k,fn)=>{const r=results[keys.indexOf(k)];
    if(r.status==="rejected"){errors.push(r.reason.message);return null;}
    if(!r.value) return null;
    try{return fn(parseCSV(r.value));}catch(e){errors.push(e.message);return null;}};
  d.smjene=parse("smjene",parseSmjene);
  d.revizija=parse("revizija",parseRevizija);
  d.teh=parse("tehnicari",parseTeh);
  d.osobe=parse("osobe",parseOsobe)||[];
  if(!d.smjene&&!d.revizija&&!d.teh){
    $app.innerHTML=`<p class="notice"><b>Raspored se nije mogao učitati.</b> ${errors.map(esc).join(" ")}<br>Provjeri jesu li listovi objavljeni na webu u formatu CSV i jesu li adrese u postavkama točne.</p>`;
    return;
  }
  d.dates=d.smjene&&d.smjene.start?[0,1,2,3,4,5].map(n=>addDays(d.smjene.start,n)):null;
  D=d; D.people=buildPeople();
  if(D.dates){const a=D.dates[0],b=D.dates[5];
    document.getElementById("subtitle").textContent=a.getMonth()===b.getMonth()
      ?`Tjedan od ${a.getDate()}. do ${b.getDate()}. ${MONTHS_GEN[b.getMonth()]}`
      :`Tjedan od ${a.getDate()}. ${MONTHS_GEN[a.getMonth()]} do ${b.getDate()}. ${MONTHS_GEN[b.getMonth()]}`;}
  const msgs=[];
  if(demo) msgs.push("Prikazuju se primjer podaci. Za pravi raspored upiši adrese objavljenih listova u postavku <code>CONFIG</code> na vrhu koda.");
  if(errors.length) msgs.push("<b>Dio rasporeda nije učitan.</b> "+errors.map(esc).join(" "));
  document.getElementById("notice").innerHTML=msgs.map(m=>`<p class="notice">${m}</p>`).join("");
  if(firstLoad){
    firstLoad=false;
    try{const saved=localStorage.getItem("raspored-osoba"); if(saved&&D.people.some(p=>p.key===saved)) state.person=saved;}catch(e){}
    const idx=nowInfo().idx; state.day=idx>=0?idx:0;
    if(state.day===5&&!(D.smjene&&D.smjene.saturday.length)) state.day=0;
  }
  if(state.person&&!D.people.some(p=>p.key===state.person)) state.person="";
  const ae=document.activeElement;
  if(!(ae&&ae.tagName==="SELECT")) render();
}
load();
setInterval(()=>{const ae=document.activeElement; if(D&&!(ae&&ae.tagName==="SELECT")) render();},60000);
setInterval(()=>{if(Object.values(CONFIG).some(Boolean)) load();},10*60000);
</script>
